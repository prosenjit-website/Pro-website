<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>অ্যাডমিন প্যানেল — প্রসেনজিৎ</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div id="loginBox" class="login">

<div class="logo">
প্রসেনজিৎ<span>.</span>
</div>

<h1>অ্যাডমিন প্যানেল</h1>

<p>তোমার ওয়েবসাইট পরিচালনা করো</p>

<form id="loginForm">

<input
id="username"
type="text"
placeholder="ইউজারনেম"
required
>

<input
id="password"
type="password"
placeholder="পাসওয়ার্ড"
required
>

<button type="submit">
প্রবেশ করুন →
</button>

</form>

<div id="loginMessage"></div>

</div>


<div id="dashboard" class="dashboard hidden">

<header class="topbar">

<div>
<strong>প্রসেনজিৎ.</strong>
<small>অ্যাডমিন</small>
</div>

<div>

<a href="/" target="_blank">
ওয়েবসাইট দেখুন ↗
</a>

<button id="logout">
লগআউট
</button>

</div>

</header>


<main class="admin-main">

<h1>স্বাগতম 👋</h1>

<p class="subtitle">
এখান থেকে তোমার ওয়েবসাইটের কনটেন্ট পরিচালনা করো।
</p>


<section class="panel">

<h2>সাইটের তথ্য</h2>

<div class="grid">

<label>
নাম
<input id="siteName">
</label>

<label>
ট্যাগলাইন
<input id="tagline">
</label>

<label>
কলেজ
<input id="college">
</label>

<label>
শিক্ষা
<input id="education">
</label>

<label class="full">
প্রোফাইল ছবির লিংক
<input id="photo">
</label>

<label class="full">
আমার সম্পর্কে
<textarea id="about"></textarea>
</label>

</div>

<button class="save" id="saveContent">
তথ্য সংরক্ষণ করুন
</button>

<div id="saveMessage"></div>

</section>


<section class="panel">

<h2>ডায়েরি</h2>

<form id="diaryForm">

<input
id="diaryTitle"
placeholder="অধ্যায়ের নাম"
required
>

<textarea
id="diaryContent"
placeholder="অধ্যায়ের বিস্তারিত লেখা"
required
></textarea>

<input
id="diaryExcerpt"
placeholder="ছোট বিবরণ"
>

<button class="save">
নতুন অধ্যায় যোগ করুন
</button>

</form>

<div id="diaryList"></div>

</section>


<section class="panel">

<h2>প্রকল্প</h2>

<form id="projectForm">

<input
id="projectTitle"
placeholder="প্রকল্পের নাম"
required
>

<input
id="projectCategory"
placeholder="ধরন"
>

<textarea
id="projectDescription"
placeholder="প্রকল্পের বিবরণ"
></textarea>

<input
id="projectLink"
placeholder="লিংক"
>

<button class="save">
নতুন প্রকল্প যোগ করুন
</button>

</form>

<div id="projectList"></div>

</section>

</main>

</div>

<script src="admin.js"></script>

</body>
</html>
