<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Admin</title>

  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>

<div class="admin-layout">

  <aside class="sidebar">

    <h2>⚡ Admin</h2>

    <button onclick="showPanel('dashboard')">ড্যাশবোর্ড</button>
    <button onclick="showPanel('site')">সাইট তথ্য</button>
    <button onclick="showPanel('sections')">Section Manager</button>
    <button onclick="showPanel('buttons')">Button Manager</button>
    <button onclick="showPanel('about')">আমার সম্পর্কে</button>
    <button onclick="showPanel('education')">শিক্ষা</button>
    <button onclick="showPanel('skills')">দক্ষতা</button>
    <button onclick="showPanel('diary')">দিনলিপি</button>
    <button onclick="showPanel('hobbies')">শখ</button>
    <button onclick="showPanel('projects')">প্রজেক্ট</button>
    <button onclick="showPanel('vision')">ভবিষ্যৎ ভাবনা</button>
    <button onclick="showPanel('contact')">যোগাযোগ</button>

    <a href="/" target="_blank" class="view-site">
      🌐 Website দেখুন
    </a>

  </aside>

  <main class="content">

    <header class="topbar">
      <h1>Portfolio Control Panel</h1>

      <button class="save-all" onclick="saveAll()">
        💾 সব Save
      </button>
    </header>

    <div id="message"></div>

    <!-- Dashboard -->

    <section id="panel-dashboard" class="panel active">

      <h2>ড্যাশবোর্ড</h2>

      <div class="stats">

        <div class="stat">
          <strong id="statEducation">0</strong>
          <span>শিক্ষা</span>
        </div>

        <div class="stat">
          <strong id="statSkills">0</strong>
          <span>দক্ষতা</span>
        </div>

        <div class="stat">
          <strong id="statDiary">0</strong>
          <span>দিনলিপি</span>
        </div>

        <div class="stat">
          <strong id="statProjects">0</strong>
          <span>প্রজেক্ট</span>
        </div>

      </div>

    </section>

    <!-- Site -->

    <section id="panel-site" class="panel">

      <h2>সাইট তথ্য</h2>

      <label>নাম</label>
      <input id="siteName">

      <label>শিরোনাম</label>
      <input id="siteTitle">

      <label>বিবরণ</label>
      <textarea id="siteDescription"></textarea>

      <label class="switch">
        <input type="checkbox" id="siteShow">
        <span>সাইট তথ্য দেখাবে</span>
      </label>

      <button class="primary" onclick="saveSite()">
        Save
      </button>

    </section>

    <!-- Sections -->

    <section id="panel-sections" class="panel">

      <h2>Section Manager</h2>

      <div id="sectionManager"></div>

    </section>

    <!-- Buttons -->

    <section id="panel-buttons" class="panel">

      <h2>Button Manager</h2>

      <div id="buttonManager"></div>

    </section>

    <!-- About -->

    <section id="panel-about" class="panel">

      <h2>আমার সম্পর্কে</h2>

      <label>শিরোনাম</label>
      <input id="aboutTitle">

      <label>বিবরণ</label>
      <textarea id="aboutText"></textarea>

      <label class="switch">
        <input type="checkbox" id="aboutShow">
        <span>দেখাবে</span>
      </label>

      <button class="primary" onclick="saveAbout()">
        Save
      </button>

    </section>

    <!-- Education -->

    <section id="panel-education" class="panel">

      <div class="panel-heading">
        <h2>শিক্ষা</h2>
        <button class="primary" onclick="addEducation()">
          + Add
        </button>
      </div>

      <div id="educationManager"></div>

    </section>

    <!-- Skills -->

    <section id="panel-skills" class="panel">

      <div class="panel-heading">
        <h2>দক্ষতা</h2>
        <button class="primary" onclick="addSkill()">
          + Add
        </button>
      </div>

      <div id="skillsManager"></div>

    </section>

    <!-- Diary -->

    <section id="panel-diary" class="panel">

      <div class="panel-heading">
        <h2>দিনলিপি</h2>
        <button class="primary" onclick="addDiary()">
          + Add
        </button>
      </div>

      <div id="diaryManager"></div>

    </section>

    <!-- Hobbies -->

    <section id="panel-hobbies" class="panel">

      <div class="panel-heading">
        <h2>শখ</h2>
        <button class="primary" onclick="addHobby()">
          + Add
        </button>
      </div>

      <div id="hobbiesManager"></div>

    </section>

    <!-- Projects -->

    <section id="panel-projects" class="panel">

      <div class="panel-heading">
        <h2>প্রজেক্ট</h2>
        <button class="primary" onclick="addProject()">
          + Add
        </button>
      </div>

      <div id="projectsManager"></div>

    </section>

    <!-- Vision -->

    <section id="panel-vision" class="panel">

      <h2>ভবিষ্যৎ ভাবনা</h2>

      <label>শিরোনাম</label>
      <input id="visionTitle">

      <label>বিবরণ</label>
      <textarea id="visionText"></textarea>

      <label class="switch">
        <input type="checkbox" id="visionShow">
        <span>দেখাবে</span>
      </label>

      <button class="primary" onclick="saveVision()">
        Save
      </button>

    </section>

    <!-- Contact -->

    <section id="panel-contact" class="panel">

      <h2>যোগাযোগ</h2>

      <label>Email</label>
      <input id="contactEmail">

      <label>Facebook</label>
      <input id="contactFacebook">

      <label>Instagram</label>
      <input id="contactInstagram">

      <label>GitHub</label>
      <input id="contactGithub">

      <label class="switch">
        <input type="checkbox" id="contactShow">
        <span>দেখাবে</span>
      </label>

      <button class="primary" onclick="saveContact()">
        Save
      </button>

    </section>

  </main>

</div>

<script src="/admin/admin.js"></script>

</body>
        </html>
