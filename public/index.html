<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitle">প্রসেনজিৎ রায়</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 7%;
      background: rgba(11,11,11,.95);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #d7b56d;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-links a:hover {
      color: #d7b56d;
    }

    section {
      padding: 90px 7%;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1000px;
    }

    .hero h1 {
      font-size: clamp(45px, 8vw, 90px);
      line-height: 1.1;
      color: #d7b56d;
    }

    .hero h2 {
      margin: 20px 0;
      font-size: 32px;
    }

    .hero p {
      max-width: 700px;
      color: #bbb;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 13px 22px;
      border: 1px solid #d7b56d;
      border-radius: 8px;
      color: #d7b56d;
      transition: .2s;
    }

    .btn:hover {
      background: #d7b56d;
      color: #111;
    }

    .section-title {
      color: #d7b56d;
      font-size: 40px;
      margin-bottom: 30px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 25px;
    }

    .card h3 {
      color: #d7b56d;
      margin-bottom: 10px;
    }

    .card p {
      color: #bbb;
    }

    .skill {
      margin-bottom: 20px;
    }

    .skill-top {
      display: flex;
      justify-content: space-between;
    }

    .bar {
      height: 8px;
      background: #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      background: #d7b56d;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #292929;
      color: #888;
    }

    @media(max-width:700px) {
      nav {
        flex-direction: column;
        gap: 15px;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      section {
        padding: 60px 5%;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo" id="logo">প্রসেনজিৎ রায়</div>

  <ul class="nav-links">
    <li><a href="#about">সম্পর্কে</a></li>
    <li><a href="#education">শিক্ষা</a></li>
    <li><a href="#skills">দক্ষতা</a></li>
    <li><a href="#diary">দিনলিপি</a></li>
    <li><a href="#projects">প্রজেক্ট</a></li>
    <li><a href="#contact">যোগাযোগ</a></li>
  </ul>
</nav>

<main>

  <section class="hero">
    <h1 id="heroName">প্রসেনজিৎ রায়</h1>
    <h2 id="heroTitle">স্বপ্ন দেখি, শিখি এবং তৈরি করি</h2>
    <p id="heroDescription"></p>

    <div class="buttons" id="heroButtons"></div>
  </section>

  <section id="about">
    <h2 class="section-title" id="aboutTitle">আমার সম্পর্কে</h2>
    <div class="card">
      <p id="aboutText"></p>
    </div>
  </section>

  <section id="education">
    <h2 class="section-title">শিক্ষাজীবন</h2>
    <div class="card-grid" id="educationList"></div>
  </section>

  <section id="skills">
    <h2 class="section-title">দক্ষতা</h2>
    <div id="skillsList"></div>
  </section>

  <section id="diary">
    <h2 class="section-title">আমার দিনলিপি</h2>
    <div class="card-grid" id="diaryList"></div>
  </section>

  <section id="hobbies">
    <h2 class="section-title">শখ</h2>
    <div class="card-grid" id="hobbiesList"></div>
  </section>

  <section id="projects">
    <h2 class="section-title">প্রজেক্ট</h2>
    <div class="card-grid" id="projectsList"></div>
  </section>

  <section id="vision">
    <h2 class="section-title" id="visionTitle">আমার ভবিষ্যৎ ভাবনা</h2>
    <div class="card">
      <p id="visionText"></p>
    </div>
  </section>

  <section id="contact">
    <h2 class="section-title">যোগাযোগ</h2>

    <div class="buttons" id="contactButtons"></div>
  </section>

</main>

<footer>
  © <span id="year"></span> প্রসেনজিৎ রায় — সর্বস্বত্ব সংরক্ষিত।
</footer>

<script>
async function loadPortfolio() {
  try {
    const response = await fetch("/api/portfolio");
    const data = await response.json();

    renderSite(data);
  } catch (error) {
    console.error("Portfolio load error:", error);
  }
}

function renderSite(data) {

  const site = data.site || {};

  if (site.show !== false) {
    document.getElementById("logo").textContent = site.name || "";
    document.getElementById("heroName").textContent = site.name || "";
    document.getElementById("heroTitle").textContent = site.title || "";
    document.getElementById("heroDescription").textContent =
      site.description || "";
  }

  const sections = data.sections || {};

  toggleSection("about", sections.about);
  toggleSection("education", sections.education);
  toggleSection("skills", sections.skills);
  toggleSection("diary", sections.diary);
  toggleSection("hobbies", sections.hobbies);
  toggleSection("projects", sections.projects);
  toggleSection("vision", sections.vision);
  toggleSection("contact", sections.contact);

  renderButtons(data.buttons);
  renderAbout(data.about);
  renderEducation(data.education);
  renderSkills(data.skills);
  renderDiary(data.diary);
  renderHobbies(data.hobbies);
  renderProjects(data.projects);
  renderVision(data.vision);
  renderContact(data.contact);

  document.getElementById("year").textContent =
    new Date().getFullYear();
}

function toggleSection(id, show) {
  const el = document.getElementById(id);

  if (el) {
    el.style.display = show === false ? "none" : "";
  }
}

function renderButtons(buttons = {}) {

  const box = document.getElementById("heroButtons");
  box.innerHTML = "";

  Object.values(buttons).forEach(button => {

    if (!button || button.show === false) return;

    const a = document.createElement("a");

    a.className = "btn";
    a.textContent = button.text || "বিস্তারিত";
    a.href = button.url || "#";

    box.appendChild(a);
  });
}

function renderAbout(about = {}) {

  if (about.show === false) return;

  document.getElementById("aboutTitle").textContent =
    about.title || "আমার সম্পর্কে";

  document.getElementById("aboutText").textContent =
    about.text || "";
}

function renderEducation(items = []) {

  const box = document.getElementById("educationList");

  box.innerHTML = "";

  items.forEach(item => {

    if (item.show === false) return;

    box.innerHTML += `
      <article class="card">
        <h3>${escapeHTML(item.title)}</h3>
        <p>${escapeHTML(item.place)}</p>
        <p>${escapeHTML(item.year)}</p>
        <p>${escapeHTML(item.description)}</p>
      </article>
    `;
  });
}

function renderSkills(items = []) {

  const box = document.getElementById("skillsList");

  box.innerHTML = "";

  items.forEach(item => {

    if (item.show === false) return;

    box.innerHTML += `
      <div class="skill">
        <div class="skill-top">
          <strong>${escapeHTML(item.name)}</strong>
          <span>${Number(item.level) || 0}%</span>
        </div>

        <div class="bar">
          <span style="width:${Number(item.level) || 0}%"></span>
        </div>
      </div>
    `;
  });
}

function renderDiary(items = []) {

  const box = document.getElementById("diaryList");

  box.innerHTML = "";

  items.forEach(item => {

    if (item.show === false) return;

    box.innerHTML += `
      <article class="card">
        <h3>${escapeHTML(item.title)}</h3>
        <small>${escapeHTML(item.date)}</small>
        <p>${escapeHTML(item.text)}</p>
      </article>
    `;
  });
}

function renderHobbies(items = []) {

  const box = document.getElementById("hobbiesList");

  box.innerHTML = "";

  items.forEach(item => {

    if (item.show === false) return;

    box.innerHTML += `
      <article class="card">
        <h3>${item.icon || "★"} ${escapeHTML(item.name)}</h3>
      </article>
    `;
  });
}

function renderProjects(items = []) {

  const box = document.getElementById("projectsList");

  box.innerHTML = "";

  items.forEach(item => {

    if (item.show === false) return;

    box.innerHTML += `
      <article class="card">
        <h3>${escapeHTML(item.title)}</h3>
        <p>${escapeHTML(item.description)}</p>
        ${
          item.url
          ? `<div class="buttons">
               <a class="btn" href="${escapeAttribute(item.url)}">
                 প্রজেক্ট দেখুন
               </a>
             </div>`
          : ""
        }
      </article>
    `;
  });
}

function renderVision(vision = {}) {

  if (vision.show === false) return;

  document.getElementById("visionTitle").textContent =
    vision.title || "আমার ভবিষ্যৎ ভাবনা";

  document.getElementById("visionText").textContent =
    vision.text || "";
}

function renderContact(contact = {}) {

  const box = document.getElementById("contactButtons");

  box.innerHTML = "";

  const links = [
    ["ই-মেইল", contact.email ? `mailto:${contact.email}` : ""],
    ["Facebook", contact.facebook],
    ["Instagram", contact.instagram],
    ["GitHub", contact.github]
  ];

  links.forEach(([text, url]) => {

    if (!url || url === "#") return;

    box.innerHTML += `
      <a class="btn"
         href="${escapeAttribute(url)}"
         target="_blank">
        ${text}
      </a>
    `;
  });
}

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHTML(value);
}

loadPortfolio();
</script>

</body>
        </html>
